<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback — Emberwood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Georgia&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #070b12; --void-2: #0e1620; --ember: #e2572a; --ember-glow: #f7a84e;
    --parchment: #e8e1d3; --ink: #aab6c6; --teal: #4fe3c9; --line: rgba(232,225,211,0.1);
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--void); color:var(--parchment); font-family:Georgia,'Times New Roman',serif; line-height:1.6; -webkit-font-smoothing:antialiased; min-height:100vh; display:flex; flex-direction:column; }
  h1,h2 { font-family:'Cormorant Garamond',Georgia,serif; font-weight:600; margin:0; }
  a { color:inherit; }
  .wrap { max-width:1100px; margin:0 auto; padding:0 32px; }
  nav { position:sticky; top:0; z-index:20; background:rgba(7,11,18,0.9); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  nav .wrap { display:flex; align-items:center; justify-content:space-between; height:64px; }
  .nav-mark { font-family:'Cormorant Garamond',serif; font-size:22px; letter-spacing:0.06em; font-weight:600; }
  .nav-links { display:flex; align-items:center; gap:24px; }
  .nav-link-plain { font-size:14px; color:var(--ink); text-decoration:none; }
  .nav-link-plain:hover { color:var(--ember-glow); }
  .nav-cta { font-family:Georgia,serif; font-size:14px; padding:9px 20px; border:1px solid var(--ember); border-radius:3px; color:var(--ember-glow); text-decoration:none; transition:background .2s ease, color .2s ease; }
  .nav-cta:hover { background:var(--ember); color:var(--void); }

  main { flex:1; display:flex; align-items:center; justify-content:center; padding:60px 24px; background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(79,227,201,0.08), transparent); }
  .card { width:100%; max-width:440px; background:linear-gradient(160deg,#101a28,#080d15); border:1px solid var(--teal); border-radius:10px; padding:32px; box-shadow:0 0 60px rgba(79,227,201,.08); }
  .card h1 { font-size:28px; color:var(--teal); text-align:center; }
  .card .sub { text-align:center; font-size:13px; color:var(--ink); margin:6px 0 26px; }

  textarea {
    width:100%; padding:12px; margin-bottom:14px; box-sizing:border-box;
    background:#0a121c; border:1px solid #2a3a4d; color:var(--parchment); border-radius:5px; font-family:Georgia,serif; font-size:14px; resize:vertical;
  }
  textarea::placeholder { color:#5a6a7a; }

  button.submit {
    width:100%; padding:13px; background:linear-gradient(180deg,var(--teal),#2a9c86);
    color:var(--void); border:none; border-radius:5px; font-weight:bold; font-size:15px; cursor:pointer; font-family:Georgia,serif;
  }
  button.submit:hover { filter:brightness(1.08); }
  button.submit:disabled { opacity:.5; cursor:not-allowed; }

  #status { font-size:12.5px; margin-top:14px; min-height:16px; text-align:center; }

  .login-prompt { text-align:center; font-size:14px; }
  .login-prompt a { color:var(--ember-glow); }

  footer { border-top:1px solid var(--line); padding:24px; text-align:center; font-size:12px; color:var(--ink); }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <div class="nav-mark">Emberwood</div>
    <div class="nav-links">
      <a href="index.html" class="nav-link-plain">Home</a>
      <a href="classes.html" class="nav-link-plain">Classes</a>
      <a href="bestiary.html" class="nav-link-plain">Bestiary</a>
      <a href="feedback.html" class="nav-link-plain">Feedback</a>
      <a class="nav-cta" href="play.html">Play Now</a>
    </div>
  </div>
</nav>

<main>
  <div class="card">
    <h1>Feedback</h1>
    <p class="sub">Found a bug, or have an idea? Tell us.</p>

    <div id="form-area" style="display:none;">
      <textarea id="message" rows="6" placeholder="What's on your mind?"></textarea>
      <button class="submit" id="submit-btn" onclick="submitFeedback()">SEND</button>
      <p id="status"></p>
    </div>

    <div id="login-area" style="display:none;">
      <p class="login-prompt">You'll need to be signed in so we know who to thank. <a href="account.html">Log in or sign up</a>, then come back here.</p>
    </div>

    <div id="loading-area">
      <p class="login-prompt" style="opacity:.6;">Checking your account...</p>
    </div>
  </div>
</main>

<footer>Emberwood: Dice &amp; Destiny</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "https://oumdjrwwhpcinaezyluy.supabase.co";
  const SUPABASE_KEY = "sb_publishable_jDzoEz6ihG9Np8QB7rD_2A_j9O5C3B9";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentUser = null;

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    document.getElementById('loading-area').style.display = 'none';
    if (session) {
      currentUser = session.user;
      document.getElementById('form-area').style.display = 'block';
    } else {
      document.getElementById('login-area').style.display = 'block';
    }
  }

  function setStatus(msg, ok) {
    const el = document.getElementById('status');
    el.innerText = msg;
    el.style.color = ok ? '#6de3b0' : '#ff8b93';
  }

  async function submitFeedback() {
    const msg = document.getElementById('message').value.trim();
    if (!msg) { setStatus('Write something first.'); return; }
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    setStatus('Sending...');
    const { error } = await sb.from('feedback').insert({ user_id: currentUser.id, message: msg });
    btn.disabled = false;
    if (error) { setStatus('Something went wrong — try again.'); return; }
    setStatus('Thanks! Feedback sent.', true);
    document.getElementById('message').value = '';
  }

  init();
</script>

</body>
</html>
